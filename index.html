<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের শাড়ির দোকান</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff5f7; margin: 0; padding: 0; text-align: center; }
        header { background-color: #b83b5e; color: white; padding: 30px; }
        h1 { margin: 0; font-size: 28px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .product-grid { display: block; }
        .product-card { display: inline-block; width: 280px; background: white; margin: 15px; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); vertical-align: top; text-align: left; }
        .product-card img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; }
        .product-title { font-size: 18px; font-weight: bold; margin: 10px 0; color: #333; }
        .product-price { color: #b83b5e; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .btn { display: block; text-align: center; background: #25d366; color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>স্বাগতম আমাদের শাড়ির বুটিকে!</h1>
        <p>সারা বাংলাদেশে ক্যাশ অন ডেলিভারি (হাতে পেয়ে টাকা দিন)</p>
    </header>

    <div class="container">
        <h2>আমাদের আকর্ষণীয় কালেকশন</h2>
        <div class="product-grid">

            <!-- শাড়ি ১ -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500" alt="শাড়ি">
                <div class="product-title">প্রিমিয়াম ঢাকাই জামদানি শাড়ি</div>
                <div class="product-price">৳ ৩,৫০০</div>
                <a href="https://wa.me/8123456789" class="btn" target="_blank">হোয়াটসঅ্যাপে অর্ডার করুন</a>
            </div>

            <!-- শাড়ি ২ -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=500" alt="শাড়ি">
                <div class="product-title">সফট কাতান সিল্ক শাড়ি</div>
                <div class="product-price">৳ ৪,২০০</div>
                <a href="https://wa.me/8123456789" class="btn" target="_blank">হোয়াটসঅ্যাপে অর্ডার করুন</a>
            </div>

        </div>
    </div>

</body>
</html>
